name: CI Python MVC - Examen T3

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar estilo con flake8 (PEP8)
        run: flake8 modelo vista controlador tests main.py

      - name: Ejecutar pruebas unitarias con pytest
        run: pytest -v

      - name: Ejecutar la aplicacion MVC
        run: python main.py
